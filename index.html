<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InFormed — Forms &amp; Surveys</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0f17;
        --card: #121826;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --border: rgba(255, 255, 255, 0.08);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f8fafc;
          --card: #ffffff;
          --text: #0f172a;
          --muted: #475569;
          --accent: #2563eb;
          --accent-hover: #1d4ed8;
          --border: rgba(15, 23, 42, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 560px;
        width: 100%;
        padding: 48px 36px;
        border-radius: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2.25rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }
      a.cta {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      a.cta:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>InFormed</h1>
      <p>Build forms, collect responses, and analyze insights in minutes.</p>
      <a class="cta" href="https://in-formed.app">Open App</a>
    </main>
  </body>
</html>
